{% extends 'base.html' %}
{% load static %}
{% block content %}
<section id="loginSection" class="auth-container">
    <div class="auth-card">
        <h2>Create an Account</h2>
        <p>Sign up to start managing your legal cases.</p>
        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn-primary" type="submit">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </form>
        <p style="margin-top: 1.5rem; color: var(--text-secondary);">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--primary-color);">Sign in</a>
        </p>
    </div>
</section>
{% endblock %}
